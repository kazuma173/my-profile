<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script src="https://cdn.tailwindcss.com"></script>
<body>
    <main class="max-w-90 mx-auto">
    <header class="bg-orange-300 text-white px-6 py-10 text-center">
    <h1 class="text-3xl font-bold mb-2">自己紹介リスト</h1>
    <p class="text-lg">ゆかいな仲間たち</p>
    </header>
    <div class="flex flex-wrap justify-between gap-4">
        <div class="rounded-lg w-90 bg-orange-100 p-4">
                <img    src="./images/worker.png"
                        art="会社員の写真"
                        class="w-full h-80 object-cover"
                >
                <span class="font-bold">
                <h1>
                    勤勉な会社員
                </h1>
                </span>
                <ul>
                    <ol>名前：高橋新平</ol>
                    <ol>趣味：マリオカート</ol>
                    <ol>好きな食べ物：すし</ol>
                </ul>

        </div>

        <div class="rounded-lg w-90 bg-orange-100 p-4">
            <img    src="./images/deliver.png"
                        art="配達員の写真"
                        class="w-full h-80 object-cover"
                >
            <span class="font-bold">
            <h1>
                謙虚な配達員
            </h1>
            </span>
            <ul>
                <ol>名前：鈴木花子</ol>
                <ol>趣味：生け花</ol>
                <ol>好きな食べ物：かつどん</ol>
            </ul>
        </div>

        <div class="rounded-lg w-90 bg-orange-100 p-4">
            <img    src="./images/doctor.png"
                        art="医者の写真"
                        class="w-full h-80 object-cover"
                >
            <span class="font-bold">
            <h1>
                名医
            </h1>
            </span>
            <ul>
                <ol>名前：渡辺清五郎</ol>
                <ol>趣味：サッカー観戦</ol>
                <ol>好きな食べ物：ラーメン</ol>
            </ul>
        </div>
    </div>
</main>
</body>
</html>
